<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英雄元素守塔 - 扭蛋與遺物紀元</title>
    <style>
        :root {
            --bg-dark: #0f172a; --panel-bg: #1e293b; --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --gold: #fbbf24;
        }
        * {
            user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
            -webkit-touch-callout: none; box-sizing: border-box; touch-action: none;
        }
        html, body {
            height: 100%; margin: 0; padding: 0; background-color: var(--bg-dark); color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden;
        }
        #app {
            width: 100%; max-width: 600px; height: 100%; margin: 0 auto;
            position: relative; display: flex; flex-direction: column; background: var(--bg-dark);
        }
        .screen {
            position: absolute; inset: 0; display: flex; flex-direction: column; 
            background-color: var(--bg-dark); z-index: 10;
        }
        .hidden { display: none !important; }
        
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 10px; font-size: 15px;
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.1s; text-align: center;
        }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn:disabled { background-color: #475569; color: #94a3b8; }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .btn-gold { background-color: #d97706; }
        .btn-purple { background-color: #9333ea; }

        /* ====== 首頁 & 扭蛋 ====== */
        .header-card {
            background: var(--panel-bg); padding: 15px; border-radius: 0 0 15px 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; border-bottom: 2px solid #334155; flex-shrink: 0;
        }
        .level-badge { font-size: 24px; font-weight: bold; color: var(--gold); margin-bottom: 5px; }
        .exp-bar-bg { background: #334155; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        .exp-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s; }
        .menu-content { padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; }
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
        .lvl-btn { padding: 15px 5px; font-size: 18px; }

        .relic-box { background: #0f172a; border: 1px solid #3b82f6; border-radius: 8px; padding: 10px; font-size: 14px; color: #cbd5e1; }
        .relic-box span { color: #fbbf24; font-weight: bold; }

        /* ====== 遊戲UI ====== */
        .game-top-bar {
            flex-shrink: 0; background: var(--panel-bg); display: flex; justify-content: space-between; 
            align-items: center; padding: 8px 12px; font-size: 15px; font-weight: bold; z-index: 5;
        }
        .game-sub-bar {
            flex-shrink: 0; background: #0b1120; display: flex; justify-content: space-between; align-items: center;
            padding: 6px 12px; border-bottom: 2px solid #1e293b; z-index: 5; font-size: 14px; font-weight: bold;
        }
        
        .speed-btn { background: #334155; border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; color: #fff; font-weight: bold; cursor:pointer;}
        .speed-btn.active { background: var(--success); border-color: var(--success); }

        .canvas-container {
            flex-grow: 1; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; background-color: #000;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
        
        .game-bottom-bar {
            flex-shrink: 0; height: 175px; background: var(--panel-bg); padding: 8px; 
            display: flex; flex-direction: column; gap: 8px; z-index: 5; box-sizing: border-box;
        }
        .info-panel {
            background: #0f172a; padding: 8px; border-radius: 8px; font-size: 14px; 
            flex-grow: 1; overflow-y: auto; border: 1px solid #334155; display: flex; flex-direction: column; gap: 4px;
        }
        .info-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .info-skill { font-size: 13px; color: #38bdf8; font-weight: bold; line-height: 1.4; margin-top: 3px; }
        
        .controls-grid { flex-shrink: 0; display: grid; grid-template-columns: 1fr 1.2fr 1.2fr; gap: 8px; height: 50px; }
        .controls-grid button { padding: 4px; font-size: 13px; line-height: 1.3; }

        /* 扭蛋結果動畫 */
        #gachaModal {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 50;
            display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; text-align: center;
        }
        .gacha-text { font-size: 24px; font-weight: bold; color: #fbbf24; margin-bottom: 20px; animation: pop 0.5s ease-out; }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="app">
    <!-- ================= 首頁 ================= -->
    <div id="mainMenu" class="screen">
        <div class="header-card">
            <div class="level-badge">指揮官 Lv.<span id="uiLevel">1</span></div>
            <div>基礎攻擊: +<span id="uiLevelBonus">0</span>%</div>
            <div class="exp-bar-bg"><div class="exp-bar-fill" id="uiExpBar"></div></div>
            <div style="font-size:14px; color:#94a3b8">經驗值: <span id="uiExp">0</span> / <span id="uiMaxExp">100</span></div>
            <div style="margin-top:10px; font-size:20px; font-weight:bold; color:var(--gold);">💰 局外金幣: <span id="uiGlobalGold">0</span></div>
        </div>
        <div class="menu-content" id="menuMain">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn btn-success" style="padding: 15px; font-size: 16px;" onclick="showLevelSelect()">🗺️ 選擇關卡</button>
                <button class="btn btn-purple" style="padding: 15px; font-size: 16px;" onclick="showGacha()">🔮 扭蛋中心</button>
                <button class="btn btn-gold" style="padding: 15px; font-size: 16px; grid-column: span 2;" onclick="startGame('random')">🎲 隨機模式 (變化迷宮/無盡)</button>
            </div>
            <hr style="border:1px solid #334155; width:100%; margin: 2px 0;">
            <h3 style="margin:0;">🛠️ 科技樹升級</h3>
            <button class="btn" onclick="upgradeTech('dmg')" id="btnTechDmg">⚔️ 傷害 +<span id="techDmgVal">0</span>% | $<span id="costDmg">0</span></button>
            <button class="btn" onclick="upgradeTech('spd')" id="btnTechSpd">⏱️ 攻速 +<span id="techSpdVal">0</span>% | $<span id="costSpd">0</span></button>
            <button class="btn" onclick="upgradeTech('money')" id="btnTechMoney">💰 初始 +$<span id="techMoneyVal">0</span> | $<span id="costMoney">0</span></button>
        </div>
        
        <!-- 關卡選擇 -->
        <div class="menu-content hidden" id="menuLevel">
            <h2 style="text-align:center; margin:0;">🗺️ 選擇關卡</h2>
            <div class="level-grid" id="levelGridUI"></div>
            <button class="btn btn-danger" style="margin-top:20px; padding:12px;" onclick="hideSubMenu()">🔙 返回</button>
        </div>

        <!-- 扭蛋中心 -->
        <div class="menu-content hidden" id="menuGacha">
            <h2 style="text-align:center; margin:0; color:#c084fc;">🔮 煉金扭蛋</h2>
            <p style="font-size:13px; color:#94a3b8; text-align:center;">抽取【衍生塔配方】與【永久遺物】</p>
            <button class="btn btn-gold" style="padding: 15px; font-size: 18px;" onclick="drawGacha()">抽一次 ($50)</button>
            
            <h4 style="margin:10px 0 0 0;">✨ 你擁有的遺物</h4>
            <div class="relic-box">
                暴擊機率：<span id="uiRelicCritR">0</span>% (上限100%)<br>
                暴擊傷害：<span id="uiRelicCritD">150</span>%<br>
                對BOSS增傷：<span id="uiRelicBoss">0</span>%
            </div>
            <h4 style="margin:10px 0 0 0;">🔓 已解鎖的配方</h4>
            <div id="unlockedCombosList" style="font-size:13px; color:#cbd5e1; display:flex; flex-wrap:wrap; gap:5px;"></div>
            
            <button class="btn btn-danger" style="margin-top:auto; padding:12px;" onclick="hideSubMenu()">🔙 返回</button>
        </div>
    </div>

    <!-- 扭蛋動畫遮罩 -->
    <div id="gachaModal" class="hidden">
        <div class="gacha-text" id="gachaResultText"></div>
        <button class="btn btn-primary" style="padding:10px 30px;" onclick="document.getElementById('gachaModal').classList.add('hidden')">確定</button>
    </div>

    <!-- ================= 遊戲畫面 ================= -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-top-bar">
            <div>💰 $<span id="gameMoney" style="color:var(--gold)">0</span></div>
            <div>空間: <span id="gameMonsterCount" style="color:var(--success)">0/30</span></div>
            <div>波數: <span id="gameWave">1</span><span id="maxWaveText">/50</span></div>
        </div>
        <div class="game-sub-bar">
            <div style="display:flex; gap:5px;">
                <button class="speed-btn active" id="btnSpd1" onclick="setSpeed(1)">1x</button>
                <button class="speed-btn" id="btnSpd2" onclick="setSpeed(2)">2x</button>
                <button class="speed-btn" id="btnSpd3" onclick="setSpeed(3)">3x</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" id="pauseBtn" onclick="togglePause()" style="padding:4px 8px;">⏸️ 暫停</button>
                <button class="btn btn-danger" onclick="leaveGame()" style="padding:4px 8px;">離開</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="720" height="1080"></canvas>
        </div>

        <div class="game-bottom-bar">
            <div class="info-panel" id="infoPanel">
                <span style="color:#94a3b8; align-self:center; margin-top:10px;">選擇塔以查看屬性技能</span>
            </div>
            <div class="controls-grid">
                <button class="btn btn-success" onclick="summonTower()">召喚塔 ($30)</button>
                <button class="btn" id="btnUpgDmg" onpointerdown="startUpg('dmg')" onpointerup="stopUpg()" onpointerleave="stopUpg()">⚔️增傷<br>Lv.<span id="uiUpgDmgLv">0</span> ($<span id="uiUpgDmgCost">20</span>)</button>
                <button class="btn btn-gold" id="btnUpgSummon" onpointerdown="startUpg('summon')" onpointerup="stopUpg()" onpointerleave="stopUpg()">✨高星<br>Lv.<span id="uiUpgSummonLv">0</span> ($<span id="uiUpgSummonCost">50</span>)</button>
            </div>
        </div>
    </div>

    <!-- ================= 結算畫面 ================= -->
    <div id="resultScreen" class="screen hidden">
        <div class="result-box">
            <h1 id="resultTitle">GAME OVER</h1>
            <p>生存波數： <strong id="resWave">0</strong></p>
            <p style="color:var(--success)">獲得經驗： +<strong id="resExp">0</strong> EXP</p>
            <p style="color:var(--gold)">獲得金幣： +<strong id="resGold">0</strong> 💰</p>
            <br>
            <button class="btn" style="width:100%" onclick="returnToMenu()">返回首頁</button>
        </div>
    </div>
</div>

<script>
    /* ================= 存檔與 UI ================= */
    let player = { 
        level: 1, exp: 0, globalGold: 200, maxLevel: 1, 
        tech: { dmgLv: 0, spdLv: 0, moneyLv: 0 },
        unlockedCombos: [], // 預設全部鎖定
        relics: { critRate: 0, critDmg: 0, bossDmg: 0 }
    };

    function loadData() { 
        const s = localStorage.getItem('heroTD_v10'); 
        if(s) player = {...player, ...JSON.parse(s)}; 
        
        // 確保遺物物件存在(相容舊存檔)
        if(!player.relics) player.relics = { critRate: 0, critDmg: 0, bossDmg: 0 };
        if(!player.unlockedCombos) player.unlockedCombos = [];
        
        updateMenuUI(); 
    }
    function saveData() { localStorage.setItem('heroTD_v10', JSON.stringify(player)); }
    function getMaxExp() { return 100 + (player.level - 1) * 50; }

    function updateMenuUI() {
        document.getElementById('uiLevel').innerText = player.level;
        document.getElementById('uiLevelBonus').innerText = (player.level - 1) * 2;
        document.getElementById('uiExp').innerText = player.exp;
        document.getElementById('uiMaxExp').innerText = getMaxExp();
        document.getElementById('uiExpBar').style.width = Math.min(100, (player.exp / getMaxExp()) * 100) + '%';
        document.getElementById('uiGlobalGold').innerText = player.globalGold;

        const cDmg = 50 + player.tech.dmgLv * 30, cSpd = 50 + player.tech.spdLv * 40, cMon = 100 + player.tech.moneyLv * 50;
        document.getElementById('techDmgVal').innerText = player.tech.dmgLv * 5;
        document.getElementById('costDmg').innerText = cDmg; document.getElementById('btnTechDmg').disabled = player.globalGold < cDmg;
        document.getElementById('techSpdVal').innerText = player.tech.spdLv * 3;
        document.getElementById('costSpd').innerText = cSpd; document.getElementById('btnTechSpd').disabled = player.globalGold < cSpd || player.tech.spdLv >= 10;
        document.getElementById('techMoneyVal').innerText = player.tech.moneyLv * 20;
        document.getElementById('costMoney').innerText = cMon; document.getElementById('btnTechMoney').disabled = player.globalGold < cMon;

        // 關卡網格
        let grid = document.getElementById('levelGridUI'); grid.innerHTML = '';
        for(let i=1; i<=10; i++) {
            let btn = document.createElement('button'); btn.className = 'btn lvl-btn';
            if (i <= player.maxLevel) { btn.classList.add('btn-primary'); btn.innerText = i; btn.onclick = () => startGame(i); } 
            else { btn.style.backgroundColor = '#334155'; btn.innerText = '🔒'; btn.disabled = true; }
            grid.appendChild(btn);
        }

        // 扭蛋遺物顯示
        document.getElementById('uiRelicCritR').innerText = Math.floor(player.relics.critRate * 100);
        document.getElementById('uiRelicCritD').innerText = 150 + Math.floor(player.relics.critDmg * 100);
        document.getElementById('uiRelicBoss').innerText = Math.floor(player.relics.bossDmg * 100);
        
        let comboUI = document.getElementById('unlockedCombosList');
        comboUI.innerHTML = player.unlockedCombos.length === 0 ? '尚未解鎖任何配方' : 
            player.unlockedCombos.map(k => `<span style="background:#1e293b; padding:4px 8px; border-radius:4px;">${ELEMENTS[k].name}塔</span>`).join('');
    }

    function showLevelSelect() { document.getElementById('menuMain').classList.add('hidden'); document.getElementById('menuLevel').classList.remove('hidden'); }
    function showGacha() { document.getElementById('menuMain').classList.add('hidden'); document.getElementById('menuGacha').classList.remove('hidden'); updateMenuUI();}
    function hideSubMenu() { document.getElementById('menuLevel').classList.add('hidden'); document.getElementById('menuGacha').classList.add('hidden'); document.getElementById('menuMain').classList.remove('hidden'); }

    function upgradeTech(type) {
        let c = 0;
        if (type==='dmg') { c = 50+player.tech.dmgLv*30; if(player.globalGold>=c){ player.globalGold-=c; player.tech.dmgLv++; } }
        else if (type==='spd') { c = 50+player.tech.spdLv*40; if(player.globalGold>=c && player.tech.spdLv<10){ player.globalGold-=c; player.tech.spdLv++; } }
        else if (type==='money') { c = 100+player.tech.moneyLv*50; if(player.globalGold>=c){ player.globalGold-=c; player.tech.moneyLv++; } }
        saveData(); updateMenuUI();
    }

    /* ================= 煉金與扭蛋系統 ================= */
    const ELEMENTS = {
        'FIRE':  { color: '#ef4444', name: '火', dmg: 35, cd: 45, range: 300, isBase: true },
        'WATER': { color: '#3b82f6', name: '水', dmg: 20, cd: 30, range: 280, isBase: true },
        'WIND':  { color: '#22c55e', name: '風', dmg: 15, cd: 25, range: 350, isBase: true },
        'ELEC':  { color: '#eab308', name: '電', dmg: 55, cd: 55, range: 280, isBase: true },
        'ICE':   { color: '#06b6d4', name: '冰', dmg: 25, cd: 40, range: 250, isBase: true },
        
        'STEAM': { color: '#9ca3af', name: '蒸氣', dmg: 25, cd: 25, range: 310, isBase: false }, 
        'SLUSH': { color: '#7dd3fc', name: '碎冰', dmg: 30, cd: 40, range: 290, isBase: false }, 
        'STORM': { color: '#1d4ed8', name: '暴雨', dmg: 40, cd: 35, range: 310, isBase: false }, 
        'CONDU': { color: '#a855f7', name: '導電', dmg: 45, cd: 45, range: 300, isBase: false }, 
        'THERM': { color: '#f97316', name: '熱震', dmg: 70, cd: 55, range: 280, isBase: false }, 
        'FSTORM':{ color: '#ea580c', name: '火捲', dmg: 35, cd: 30, range: 330, isBase: false }, 
        'PLASM': { color: '#d946ef', name: '電漿', dmg: 110, cd: 60, range: 300, isBase: false },
        'BLIZZ': { color: '#e0f2fe', name: '風雪', dmg: 25, cd: 35, range: 360, isBase: false }, 
        'SUPER': { color: '#c084fc', name: '超導', dmg: 60, cd: 50, range: 340, isBase: false }, 
        'TSTORM':{ color: '#84cc16', name: '雷暴', dmg: 40, cd: 20, range: 300, isBase: false }  
    };
    const BASE_KEYS = ['FIRE', 'WATER', 'WIND', 'ELEC', 'ICE'];
    const COUNTERS = { 'WATER': 'FIRE', 'FIRE': 'WIND', 'WIND': 'ELEC', 'ELEC': 'ICE', 'ICE': 'WATER' };

    const COMBO_MAP = {
        'WATER,FIRE': 'STEAM', 'FIRE,WATER': 'STEAM', 'WATER,ICE': 'SLUSH', 'ICE,WATER': 'SLUSH',
        'WATER,WIND': 'STORM', 'WIND,WATER': 'STORM', 'WATER,ELEC': 'CONDU', 'ELEC,WATER': 'CONDU',
        'FIRE,ICE': 'THERM', 'ICE,FIRE': 'THERM', 'FIRE,WIND': 'FSTORM', 'WIND,FIRE': 'FSTORM',
        'FIRE,ELEC': 'PLASM', 'ELEC,FIRE': 'PLASM', 'ICE,WIND': 'BLIZZ', 'WIND,ICE': 'BLIZZ',
        'ICE,ELEC': 'SUPER', 'ELEC,ICE': 'SUPER', 'WIND,ELEC': 'TSTORM', 'ELEC,WIND': 'TSTORM'
    };
    
    // 取得不重複的衍生塔陣列
    const DERIVED_KEYS = Object.keys(COMBO_MAP).map(k => COMBO_MAP[k]).filter((v, i, a) => a.indexOf(v) === i);

    function drawGacha() {
        if(player.globalGold < 50) return alert("金幣不足!");
        player.globalGold -= 50;
        
        let lockedTowers = DERIVED_KEYS.filter(k => !player.unlockedCombos.includes(k));
        let roll = Math.random();
        
        let modal = document.getElementById('gachaModal');
        let resText = document.getElementById('gachaResultText');
        
        // 40% 機率抽塔配方 (若還有未解鎖的)
        if (roll < 0.4 && lockedTowers.length > 0) {
            let t = lockedTowers[Math.floor(Math.random() * lockedTowers.length)];
            player.unlockedCombos.push(t);
            resText.innerHTML = `🎉 獲得新配方！<br><br><span style="color:${ELEMENTS[t].color}; font-size:32px;">${ELEMENTS[t].name}塔</span><br><br><span style="font-size:16px; color:#cbd5e1;">現在可以在場上合成了</span>`;
        } else {
            // 抽遺物
            let r = Math.random();
            if(r < 0.33) {
                if (player.relics.critRate >= 1.0) { player.globalGold += 50; return alert("暴擊率已達上限，退還金幣！"); }
                player.relics.critRate += 0.05;
                resText.innerHTML = `✨ 獲得遺物加成<br><br><span style="color:#f87171;">暴擊率 +5%</span>`;
            } else if(r < 0.66) {
                player.relics.critDmg += 0.20;
                resText.innerHTML = `✨ 獲得遺物加成<br><br><span style="color:#f87171;">暴擊傷害 +20%</span>`;
            } else {
                player.relics.bossDmg += 0.10;
                resText.innerHTML = `✨ 獲得遺物加成<br><br><span style="color:#f87171;">對 BOSS 傷害 +10%</span>`;
            }
        }
        
        saveData(); updateMenuUI();
        modal.classList.remove('hidden');
    }

    /* ================= Web Worker 背景遊戲引擎 ================= */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GAME_W = 720, GAME_H = 1080, TILE = 120, COLS = 6, ROWS = 9;
    
    let gameState = { isActive: false, money: 0, wave: 1, frame: 0, isOver: false, isPaused: false, globalDmgLv: 0, summonLv: 0, bossSpawned: false, mode: 1, speed: 1 };
    let pathCells = [], enemies = [], towers = [], bullets = [], visuals = [];
    let draggedTower = null, selectedTower = null;
    let dragStartX = 0, dragStartY = 0, mouseX = 0, mouseY = 0;

    // 建立 Web Worker (確保背景網頁切換時，時間不會停止)
    const workerCode = `
        let timer = null;
        self.onmessage = function(e) {
            if (e.data === 'start') {
                if(timer) clearInterval(timer);
                timer = setInterval(() => self.postMessage('tick'), 16); // ~60fps
            } else if (e.data === 'stop') {
                clearInterval(timer);
            }
        };
    `;
    const workerBlob = new Blob([workerCode], {type: 'application/javascript'});
    const gameWorker = new Worker(URL.createObjectURL(workerBlob));
    
    gameWorker.onmessage = function() {
        if (!gameState.isActive || gameState.isOver || gameState.isPaused) return;
        
        try {
            // 變速系統：每個畫面幀執行 N 次邏輯
            for(let i=0; i<gameState.speed; i++) {
                updateLogic();
            }
            // 繪圖只執行一次
            drawAll();
            fastUpdateDOM();
        } catch (err) { console.error(err); }
    };

    function setSpeed(spd) {
        gameState.speed = spd;
        document.getElementById('btnSpd1').className = 'speed-btn' + (spd===1?' active':'');
        document.getElementById('btnSpd2').className = 'speed-btn' + (spd===2?' active':'');
        document.getElementById('btnSpd3').className = 'speed-btn' + (spd===3?' active':'');
    }

    function updateLogic() {
        gameState.frame++;
        
        if (gameState.frame % 600 === 0 && (gameState.mode === 'random' || gameState.wave < 50)) { 
            gameState.wave++; gameState.bossSpawned = false;
        }

        if (gameState.wave % 10 === 0) {
            if (!gameState.bossSpawned) { enemies.push(new Enemy(gameState.wave, true)); gameState.bossSpawned = true; }
        } else {
            let spInt = Math.max(30, 150 - gameState.wave * 3);
            if (gameState.frame % spInt === 0) enemies.push(new Enemy(gameState.wave, false));
        }
        
        enemies = enemies.filter(e => { let a = e.update(); return a && e.hp>0; });

        let mCount = enemies.reduce((sum, e) => sum + (e.isBoss ? 10 : 1), 0);
        if (mCount >= 30) { endGame(false); return; }
        if (gameState.mode !== 'random' && gameState.wave >= 50 && gameState.bossSpawned && enemies.length === 0) { endGame(true); return; }

        towers.forEach(t => { if(t !== draggedTower) t.update(); });
        bullets = bullets.filter(b => b.update());
        visuals = visuals.filter(v => { v.life--; return v.life>0; });
        
        // 觸發全域光環
        updateAuras();
    }

    function drawAll() {
        ctx.clearRect(0, 0, GAME_W, GAME_H); 
        
        // 畫網格
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, GAME_W, GAME_H);
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
        for(let i=0; i<=GAME_W; i+=TILE) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 7*TILE); ctx.stroke(); }
        for(let j=0; j<=7*TILE; j+=TILE) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(GAME_W, j); ctx.stroke(); }
        ctx.fillStyle = '#334155'; for(let c of pathCells) ctx.fillRect(c.x*TILE, c.y*TILE, TILE, TILE);
        ctx.fillStyle = '#0b1120'; ctx.fillRect(0, 7*TILE, GAME_W, TILE);
        ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText("⬇️ 備戰區 (僅1排共6格) ⬇️", GAME_W/2, 7*TILE + TILE/2);
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 4;
        for(let x=0; x<COLS; x++) ctx.strokeRect(x*TILE, 8*TILE, TILE, TILE);

        // 畫範圍圈
        if (selectedTower && !draggedTower) {
            ctx.beginPath(); ctx.arc(selectedTower.x, selectedTower.y, selectedTower.baseStats.range, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth=2; ctx.stroke();
        }

        enemies.forEach(e => e.draw());
        towers.forEach(t => { if(t !== draggedTower) t.draw(); });
        bullets.forEach(b => b.draw());

        visuals.forEach(v => {
            if(v.t === 'splash') { v.r += (v.maxR-v.r)*0.3; ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, Math.PI*2); ctx.fillStyle=`rgba(${v.color},${v.life/25*0.6})`; ctx.fill(); }
            else if(v.t === 'bolt') { ctx.beginPath(); ctx.moveTo(v.x1, v.y1); ctx.lineTo(v.x2, v.y2); ctx.strokeStyle=`rgba(${v.color},${v.life/10})`; ctx.lineWidth=6; ctx.stroke(); }
            else if(v.t === 'text') { 
                ctx.beginPath(); ctx.fillStyle = v.color; ctx.globalAlpha = v.life/30; ctx.font = 'bold 36px Arial'; 
                ctx.shadowColor='black'; ctx.shadowBlur=4; ctx.textAlign='center'; 
                ctx.fillText(v.text, v.x, v.y - (30-v.life)); ctx.globalAlpha=1.0; ctx.shadowBlur=0;
            }
        });

        if (draggedTower) {
            if (mouseY < 7*TILE) { 
                ctx.beginPath(); ctx.arc(mouseX, mouseY, draggedTower.baseStats.range, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth=2; ctx.stroke();
            }
            draggedTower.draw(mouseX, mouseY);
        }
    }

    /* ================= 遊戲物件 ================= */
    class Enemy {
        constructor(wave, isBoss = false) {
            this.pathIndex = 0; this.isBoss = isBoss;
            this.x = pathCells[0].x * TILE + TILE/2; this.y = pathCells[0].y * TILE + TILE/2;
            
            // 狀態異常
            this.slowTimer = 0; this.slowRatio = 1;
            this.stunTimer = 0; this.burnTimer = 0; this.burnDmg = 0; this.armorBreakTimer = 0;
            
            // 怪物抗性變異 (Traits)
            this.traits = [];
            if(wave >= 11) this.traits.push('HARD_SKIN');
            if(wave >= 21) this.traits.push('CC_RESIST');
            if(wave >= 31) this.traits.push('REGEN');
            if(wave >= 41) this.traits.push('SHIELD');

            let diffM = (gameState.mode === 'random') ? 5 : gameState.mode; 
            if (isBoss) {
                this.bossType = BASE_KEYS[((wave / 10) - 1) % 5];
                this.maxHp = 1000 + wave * 400 * (1 + diffM*0.1) + Math.pow(wave, 2.2) * 15;
                this.hp = this.maxHp;
                this.baseSpeed = 0.9 + (wave * 0.015);
                this.radius = 45; this.reward = 100;
                this.color = ELEMENTS[this.bossType].color;
            } else {
                this.maxHp = 60 + wave * 45 * (1 + diffM*0.1) + Math.pow(wave, 1.7) * 5;
                this.hp = this.maxHp;
                this.baseSpeed = 1.8 + (wave * 0.025);
                this.radius = 24; this.reward = 5 + Math.floor(wave / 5);
                this.color = '#a855f7';
            }
        }
        
        applyDamage(dmg) {
            // 防禦抗性計算
            if(this.traits.includes('SHIELD')) dmg *= 0.5;
            else if(this.traits.includes('HARD_SKIN')) dmg *= 0.7;
            this.hp -= dmg;
        }

        applyCC(type, duration, val) {
            // 控制抗性計算
            if(this.traits.includes('CC_RESIST')) duration = Math.floor(duration / 2);
            if(type === 'SLOW') { this.slowTimer = duration; this.slowRatio = val; }
            if(type === 'STUN') { this.stunTimer = duration; }
        }

        knockback(amount) {
            if(this.traits.includes('CC_RESIST')) amount *= 0.5;
            let prevNode = pathCells[Math.max(0, this.pathIndex - 1)];
            let dx = prevNode.x * TILE + TILE/2 - this.x, dy = prevNode.y * TILE + TILE/2 - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 0) { this.x += (dx/dist)*amount; this.y += (dy/dist)*amount; }
        }

        update() {
            // DOT 與回血
            if (this.burnTimer > 0) {
                this.applyDamage(this.burnDmg); this.burnTimer--;
                if(gameState.frame % 10 === 0) visuals.push({t:'text', text:'🔥', x:this.x, y:this.y, life:15, color:'#ef4444'});
            }
            if (this.traits.includes('REGEN') && gameState.frame % 60 === 0) {
                this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.02);
            }

            if (this.armorBreakTimer > 0) this.armorBreakTimer--;
            if (this.stunTimer > 0) { this.stunTimer--; return this.hp > 0; }

            let nextIndex = (this.pathIndex + 1) % pathCells.length;
            let tg = pathCells[nextIndex];
            let spd = this.slowTimer > 0 ? this.baseSpeed * this.slowRatio : this.baseSpeed;
            if(this.slowTimer > 0) this.slowTimer--;

            let tx = tg.x * TILE + TILE/2, ty = tg.y * TILE + TILE/2;
            let dx = tx - this.x, dy = ty - this.y, dist = Math.hypot(dx, dy);

            if (dist > TILE * 2) { this.x = tx; this.y = ty; this.pathIndex = nextIndex; return this.hp > 0; }
            if (dist < spd) { this.x = tx; this.y = ty; this.pathIndex = nextIndex; } 
            else { this.x += (dx/dist)*spd; this.y += (dy/dist)*spd; }
            return this.hp > 0;
        }
        
        draw() {
            ctx.fillStyle = this.slowTimer > 0 ? '#7dd3fc' : this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
            if(this.slowTimer > 0) { ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 6; ctx.stroke(); }
            if(this.armorBreakTimer > 0) { ctx.strokeStyle = '#f97316'; ctx.lineWidth = 5; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);}
            else if(this.isBoss) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); }
            
            // 繪製抗性標籤
            if(this.traits.length > 0) {
                let icons = "";
                if(this.traits.includes('HARD_SKIN')) icons += "🪨";
                if(this.traits.includes('CC_RESIST')) icons += "⚡";
                if(this.traits.includes('REGEN')) icons += "💖";
                if(this.traits.includes('SHIELD')) icons += "🛡️";
                ctx.fillStyle = 'white'; ctx.font = '14px Arial'; ctx.textAlign='center';
                ctx.fillText(icons, this.x, this.y - this.radius - 28);
            }

            // 血條
            let bw = this.isBoss ? 80 : 50;
            ctx.fillStyle = '#1e293b'; ctx.fillRect(this.x-bw/2, this.y-this.radius-18, bw, 10);
            ctx.fillStyle = this.isBoss ? '#ef4444' : '#22c55e'; ctx.fillRect(this.x-bw/2, this.y-this.radius-18, bw*(this.hp/this.maxHp), 10);
            if(this.isBoss) { 
                ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial'; ctx.textAlign='center'; 
                ctx.shadowColor='black'; ctx.shadowBlur=4; ctx.fillText("BOSS", this.x, this.y + 8); ctx.shadowBlur=0;
            }
        }
    }

    class Tower {
        constructor(gx, gy, isBench) {
            this.gridX = gx; this.gridY = gy; this.isBench = isBench;
            this.star = 1; this.upgradeLv = 0; this.timer = 0; this.fireBuff = 1; 
            let k = BASE_KEYS[Math.floor(Math.random() * BASE_KEYS.length)];
            this.type = k; this.baseStats = ELEMENTS[k];
            this.updatePosition();
        }
        updatePosition() { this.x = this.gridX * TILE + TILE/2; this.y = this.gridY * TILE + TILE/2; }
        getDamage() {
            let lvM = 1 + ((player.level - 1) * 0.02), tcM = 1 + (player.tech.dmgLv * 0.05), globalM = 1 + (gameState.globalDmgLv * 0.05);
            return this.baseStats.dmg * lvM * tcM * globalM * Math.pow(1.8, this.star - 1) * (1 + this.upgradeLv * 0.2) * this.fireBuff;
        }
        getCooldown() { return Math.max(8, (this.baseStats.cd - this.star * 2) * (1 - player.tech.spdLv * 0.03)); }
        update() {
            if (this.isBench || this === draggedTower) return;
            if (this.timer > 0) this.timer--;
            if (this.timer <= 0) {
                let tgts = enemies.filter(e => Math.hypot(e.x - this.x, e.y - this.y) <= this.baseStats.range);
                if (tgts.length > 0) {
                    let shots = 1;
                    if(this.type === 'WIND') shots = 1 + this.star;
                    if(this.type === 'FSTORM') shots = 2 + this.star; 
                    
                    for (let i = 0; i < Math.min(tgts.length, shots); i++) {
                        bullets.push(new Bullet(this.x, this.y, tgts[i], this.getDamage(), this.type, this.star));
                    }
                    let finalCd = this.getCooldown();
                    if(this.type === 'TSTORM') finalCd *= 0.4; 
                    this.timer = finalCd;
                }
            }
        }
        draw(dx = this.x, dy = this.y) {
            ctx.fillStyle = this.isBench ? '#334155' : '#1e293b'; ctx.fillRect(dx-50, dy-50, 100, 100);
            if (this === selectedTower && !draggedTower) { ctx.strokeStyle='#fbbf24'; ctx.lineWidth=5; ctx.strokeRect(dx-52, dy-52, 104, 104); }
            if (this.fireBuff > 1 && !this.isBench) { ctx.beginPath(); ctx.arc(dx, dy, 48, 0, Math.PI*2); ctx.fillStyle='rgba(239, 68, 68, 0.3)'; ctx.fill(); }
            
            ctx.fillStyle = this.baseStats.color; ctx.beginPath(); ctx.arc(dx, dy, 32, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'white'; ctx.shadowColor = 'black'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
            ctx.font = 'bold 24px sans-serif'; ctx.textAlign='left'; ctx.fillText('★'+this.star, dx-45, dy-20);
            if (this.upgradeLv>0) { ctx.fillStyle='#fbbf24'; ctx.font = '16px sans-serif'; ctx.fillText('+'+this.upgradeLv, dx+15, dy-24); }
            
            ctx.fillStyle = 'white'; ctx.textAlign='center'; ctx.textBaseline='middle'; 
            ctx.font = this.baseStats.isBase ? 'bold 22px sans-serif' : 'bold 18px sans-serif';
            ctx.fillText(this.baseStats.name, dx, dy+8);
            ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; 
        }
    }

    class Bullet {
        constructor(x, y, tg, dmg, t, s) {
            this.x=x; this.y=y; this.target=tg; this.damage=dmg; this.type=t; this.star=s;
            this.color = ELEMENTS[t].color; this.speed = 25;
        }
        applyAoe(radius, effectFn) { enemies.forEach(e => { if(Math.hypot(e.x-this.target.x, e.y-this.target.y) <= radius) effectFn(e); }); }
        update() {
            if(this.target.hp <= 0) return false;
            let dx = this.target.x-this.x, dy = this.target.y-this.y, dist = Math.hypot(dx, dy);
            if(dist < this.speed + this.target.radius) {
                
                // 遺物暴擊計算
                let isCrit = Math.random() < player.relics.critRate;
                let critMult = isCrit ? (1.5 + player.relics.critDmg) : 1.0;
                
                let dmgMulti = 1.0 * critMult;
                if (this.target.isBoss) dmgMulti *= (1.0 + player.relics.bossDmg);

                if (this.target.isBoss && COUNTERS[this.type] === this.target.bossType) {
                    dmgMulti *= 2.0; visuals.push({ t:'text', text:'克制!', x: this.target.x, y: this.target.y - 40, life: 30, color: '#fbbf24' });
                }
                if (this.target.armorBreakTimer > 0) dmgMulti *= 1.5;
                let fD = this.damage * dmgMulti;

                if(isCrit) visuals.push({ t:'text', text:'💥CRIT', x: this.target.x, y: this.target.y, life: 25, color: '#f87171' });

                switch(this.type) {
                    case 'FIRE': this.target.applyDamage(fD); break;
                    case 'WATER': 
                        this.target.applyDamage(fD); let rw = 100 + this.star*20;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rw, life:15, color:'59,130,246' });
                        this.applyAoe(rw, e => { if(e!==this.target) e.applyDamage(fD*0.3); }); break;
                    case 'WIND': this.target.applyDamage(fD); break;
                    case 'ELEC': 
                        this.target.applyDamage(fD); let ch = enemies.filter(e => e!==this.target && Math.hypot(e.x-this.target.x, e.y-this.target.y)<220);
                        for(let i=0; i<Math.min(ch.length, 1+this.star); i++) {
                            ch[i].applyDamage(fD*0.8); visuals.push({ t:'bolt', x1:this.target.x, y1:this.target.y, x2:ch[i].x, y2:ch[i].y, life:10, color:'234,179,8' });
                        } break;
                    case 'ICE':
                        this.target.applyDamage(fD); this.target.applyCC('SLOW', 45 + this.star*15, Math.max(0.15, 0.6 - (this.star*0.1))); break;
                    case 'STEAM': 
                        this.target.applyDamage(fD); this.target.armorBreakTimer = 180; this.target.burnTimer = 180; this.target.burnDmg = fD * 0.05;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:100, life:20, color:'156,163,175' }); break;
                    case 'SLUSH': 
                        this.target.applyDamage(fD); let rs = 130 + this.star*25;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rs, life:20, color:'125,211,252' });
                        this.applyAoe(rs, e => { e.applyCC('SLOW', 90, 0.2); }); break;
                    case 'STORM': 
                        this.target.applyDamage(fD); let rt = 130 + this.star*20;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rt, life:15, color:'29,78,216' });
                        this.applyAoe(rt, e => { e.knockback(40 + this.star*15); }); break;
                    case 'CONDU': 
                        this.target.applyDamage(fD); this.target.applyCC('STUN', 30, null);
                        let cc = enemies.filter(e => e!==this.target && Math.hypot(e.x-this.target.x, e.y-this.target.y)<250);
                        for(let i=0; i<Math.min(cc.length, 2+this.star); i++) {
                            cc[i].applyDamage(fD*0.7); cc[i].applyCC('STUN', 30, null); 
                            visuals.push({ t:'bolt', x1:this.target.x, y1:this.target.y, x2:cc[i].x, y2:cc[i].y, life:10, color:'168,85,247' });
                        } break;
                    case 'THERM': 
                        this.target.applyDamage(fD); let rth = 150 + this.star*25;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rth, life:20, color:'249,115,22' });
                        this.applyAoe(rth, e => { e.applyDamage(fD * 0.8); e.armorBreakTimer = 180; }); break;
                    case 'FSTORM': 
                        this.target.applyDamage(fD); let rf = 130 + this.star*20;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rf, life:25, color:'234,88,12' });
                        this.applyAoe(rf, e => { e.burnTimer = 180; e.burnDmg = fD * 0.08; }); break;
                    case 'PLASM': 
                        this.target.applyDamage(fD * 2.5); this.target.armorBreakTimer = 120;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:80, life:10, color:'217,70,239' }); break;
                    case 'BLIZZ': 
                        this.target.applyDamage(fD); let rb = 180 + this.star*30;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rb, life:25, color:'224,242,254' });
                        this.applyAoe(rb, e => { e.applyCC('STUN', 45, null); e.applyDamage(fD*0.4); }); break;
                    case 'SUPER': 
                        this.target.applyDamage(fD); let rsu = 150 + this.star*20;
                        visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:rsu, life:20, color:'192,132,252' });
                        this.applyAoe(rsu, e => { e.armorBreakTimer = 120; e.applyCC('STUN', 20, null); e.applyDamage(fD*0.6); }); break;
                    case 'TSTORM': 
                        this.target.applyDamage(fD); this.target.applyCC('STUN', 15, null);
                        visuals.push({ t:'bolt', x1:this.x, y1:this.y, x2:this.target.x, y2:this.target.y, life:5, color:'132,204,22' }); break;
                }
                
                if(this.target.hp <= 0) { gameState.money += this.target.reward; }
                return false;
            }
            this.x += (dx/dist)*this.speed; this.y += (dy/dist)*this.speed; return true;
        }
        draw() { ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI*2); ctx.fill(); }
    }

    function updateAuras() {
        towers.forEach(t => t.fireBuff = 1);
        towers.forEach(t => {
            if (t.type === 'FIRE' && !t.isBench) {
                let buff = 1.3 + (t.star * 0.2);
                towers.forEach(o => { if (o!==t && !o.isBench && Math.hypot(o.x-t.x, o.y-t.y) <= t.baseStats.range) o.fireBuff = Math.max(o.fireBuff, buff); });
            }
        });
    }

                case 'BLIZZ': sk = `🌨️風雪: 大範圍【完全凍結】`; break;
                case 'SUPER': sk = `🔮超導: 領域敵人同時【破甲】與【暈眩】`; break;
                case 'TSTORM': sk = `⚡雷暴: 【極限攻速】並附帶震盪暈眩`; break;
            }
            info.innerHTML = `
                <div class="info-top">
                    <span style="color:${t.baseStats.color}; font-weight:bold; font-size:16px;">
                        ${t.baseStats.name}塔 ★${t.star} <button class="btn btn-danger" onclick="sellSelected()" style="padding:4px 8px; font-size:12px; margin-left:10px;">出售($${sP})</button>
                    </span>
                    <span style="font-size:13px; color:#cbd5e1;">攻:${d} | 速:${spd}s | 距:${t.baseStats.range}</span>
                </div>
                <div class="info-skill">✨技能: ${sk}</div>
            `;
        } else {
            let p3 = gameState.summonLv * 1; let p2 = gameState.summonLv * 2;
            info.innerHTML = `<span style="color:#94a3b8; align-self:center; margin-top:5px; text-align:center;">選擇塔以查看屬性技能<br><span style="font-size:12px;color:#3b82f6">(目前抽卡機率: 2星 ${p2}%, 3星 ${p3}%)</span></span>`;
        }
    }

    let upgInterval = null;
    function startUpg(type) { doUpg(type); upgInterval = setInterval(() => doUpg(type), 120); }
    function stopUpg() { clearInterval(upgInterval); }
    function doUpg(type) {
        if(type === 'dmg') { let c = 20 + gameState.globalDmgLv * 10; if (gameState.money >= c && !gameState.isOver) { gameState.money -= c; gameState.globalDmgLv++; updateInfoPanel(); } } 
        else { let c = 50 + gameState.summonLv * 20; if (gameState.money >= c && !gameState.isOver) { gameState.money -= c; gameState.summonLv++; updateInfoPanel(); } }
    }

    function summonTower() {
        if(gameState.money >= 30) {
            let empty = null;
            for(let x=0; x<COLS; x++){ if(!towers.find(t=>t.gridX===x && t.gridY===8)) { empty={x,y:8}; break; } }
            if(empty) {
                gameState.money-=30; let rand = Math.random() * 100;
                let s3 = gameState.summonLv * 1.0, s2 = gameState.summonLv * 2.0, star = 1;
                if (rand < s3) star = 3; else if (rand < s3 + s2) star = 2;
                let t = new Tower(empty.x, empty.y, true); t.star = star; towers.push(t);
                updateInfoPanel();
            } else alert("備戰區已滿！請先合成或移至場上。");
        }
    }
    function sellSelected() { if(selectedTower){ gameState.money += 15*Math.pow(2, selectedTower.star-1) + (selectedTower.upgradeLv*10); towers = towers.filter(t=>t!==selectedTower); selectedTower=null; updateAuras(); updateInfoPanel(); } }

    function getEventCoords(e) {
        let rect = canvas.getBoundingClientRect(); let cx, cy;
        if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } 
        else if (e.changedTouches && e.changedTouches.length > 0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        if (cx === undefined || cy === undefined) return null;
        
        let scale = Math.min(rect.width / GAME_W, rect.height / GAME_H);
        let offsetX = (rect.width - (GAME_W * scale)) / 2;
        let offsetY = (rect.height - (GAME_H * scale)) / 2;
        return { x: (cx - rect.left - offsetX) / scale, y: (cy - rect.top - offsetY) / scale };
    }

    function handleStart(e) {
        try {
            if(!gameState.isActive || gameState.isOver || gameState.isPaused) return;
            let pos = getEventCoords(e); if(!pos) return;
            let gx = Math.floor(pos.x / TILE), gy = Math.floor(pos.y / TILE);
            let t = towers.find(t => t.gridX === gx && t.gridY === gy);
            if(t) { draggedTower = t; selectedTower = t; dragStartX = gx; dragStartY = gy; updateInfoPanel(); } 
            else { selectedTower = null; updateInfoPanel(); }
        } catch(err) {}
    }
    function handleMove(e) { try { if(draggedTower) { let pos = getEventCoords(e); if(pos) { mouseX = pos.x; mouseY = pos.y; } } } catch(err){} }
    function handleEnd(e) {
        try {
            if(!draggedTower) return;
            let pos = getEventCoords(e);
            if(!pos) { draggedTower.updatePosition(); draggedTower = null; return; }
            let dropX = Math.floor(pos.x / TILE), dropY = Math.floor(pos.y / TILE);
            
            if(isNaN(dropX) || isNaN(dropY) || dropX < 0 || dropX >= COLS || dropY < 0 || dropY >= ROWS) { 
                draggedTower.updatePosition(); draggedTower = null; return; 
            }

            let isClick = (dropX === dragStartX && dropY === dragStartY);
            let inBoard = dropY >= 0 && dropY <= 6;
            let inBench = dropY === 8;
            let targetT = towers.find(t => t.gridX === dropX && t.gridY === dropY && t !== draggedTower);
            let onPath = pathCells.some(c => c.x === dropX && c.y === dropY);

            if(isClick) { selectedTower = draggedTower; updateInfoPanel(); } 
            else {
                if(targetT) {
                    if(targetT.star === draggedTower.star) {
                        let comboKey = `${targetT.type},${draggedTower.type}`;
                        if (targetT.baseStats.isBase && draggedTower.baseStats.isBase && COMBO_MAP[comboKey]) {
                            if (player.unlockedCombos.includes(COMBO_MAP[comboKey])) {
                                targetT.type = COMBO_MAP[comboKey]; targetT.baseStats = ELEMENTS[targetT.type];
                            } else {
                                // 未解鎖則視為交換
                                alert("尚未解鎖該衍生配方！請前往扭蛋中心抽取。");
                                let tx = targetT.gridX, ty = targetT.gridY, tb = targetT.isBench;
                                targetT.gridX = draggedTower.gridX; targetT.gridY = draggedTower.gridY; targetT.isBench = draggedTower.isBench;
                                draggedTower.gridX = tx; draggedTower.gridY = ty; draggedTower.isBench = tb;
                                targetT.updatePosition(); draggedTower.updatePosition(); selectedTower = draggedTower;
                                draggedTower = null; return;
                            }
                        } 
                        targetT.star++; targetT.upgradeLv = Math.floor((targetT.upgradeLv + draggedTower.upgradeLv) / 2);
                        towers = towers.filter(t => t !== draggedTower);
                        if(selectedTower === draggedTower) selectedTower = targetT;
                    } else {
                        let tx = targetT.gridX, ty = targetT.gridY, tb = targetT.isBench;
                        targetT.gridX = draggedTower.gridX; targetT.gridY = draggedTower.gridY; targetT.isBench = draggedTower.isBench;
                        draggedTower.gridX = tx; draggedTower.gridY = ty; draggedTower.isBench = tb;
                        targetT.updatePosition(); draggedTower.updatePosition(); selectedTower = draggedTower;
                    }
                } else if(inBoard && !onPath) {
                    draggedTower.gridX = dropX; draggedTower.gridY = dropY; draggedTower.isBench = false; draggedTower.updatePosition(); selectedTower = draggedTower;
                } else if(inBench) {
                    draggedTower.gridX = dropX; draggedTower.gridY = dropY; draggedTower.isBench = true; draggedTower.updatePosition(); selectedTower = draggedTower;
                } else { draggedTower.updatePosition(); }
            }
        } catch(err) { console.error(err); } finally { if(draggedTower) draggedTower.updatePosition(); draggedTower = null; updateAuras(); updateInfoPanel(); }
    }

    canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleStart(e); }, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); handleMove(e); }, {passive:false});
    canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); handleEnd(e); }, {passive:false});

    /* ================= 關卡路徑配置 (6x7戰鬥區) ================= */
    function togglePause() { gameState.isPaused = !gameState.isPaused; document.getElementById('pauseBtn').innerText = gameState.isPaused ? '▶️ 繼續' : '⏸️ 暫停'; }
    function leaveGame() { if(confirm("確定要離開嗎？(關卡模式將視為失敗)")) { endGame(false); } }

    function buildPathFromPoints(points) {
        let p = [];
        for(let i=0; i<points.length-1; i++) {
            let p1 = points[i], p2 = points[i+1];
            let dx = Math.sign(p2.x - p1.x), dy = Math.sign(p2.y - p1.y);
            let cx = p1.x, cy = p1.y;
            while(cx !== p2.x || cy !== p2.y) { p.push({x: cx, y: cy}); cx += dx; cy += dy; }
        }
        p.push(points[points.length-1]); return p;
    }

    function getLevelPath(lvl) {
        let pts = [];
        if(lvl===1) pts=[{x:0,y:0},{x:5,y:0},{x:5,y:6},{x:0,y:6},{x:0,y:1}]; 
        else if(lvl===2) pts=[{x:0,y:1},{x:5,y:1},{x:5,y:3},{x:0,y:3},{x:0,y:5},{x:5,y:5}];
        else if(lvl===3) pts=[{x:0,y:0},{x:0,y:6},{x:2,y:6},{x:2,y:1},{x:3,y:1},{x:3,y:6},{x:5,y:6},{x:5,y:0}];
        else if(lvl===4) pts=[{x:0,y:0},{x:5,y:0},{x:5,y:6},{x:0,y:6},{x:0,y:2},{x:3,y:2},{x:3,y:4},{x:2,y:4}];
        else if(lvl===5) pts=[{x:0,y:6},{x:0,y:0},{x:2,y:0},{x:2,y:4},{x:3,y:4},{x:3,y:0},{x:5,y:0},{x:5,y:6}];
        else if(lvl===6) pts=[{x:0,y:0},{x:5,y:0},{x:5,y:1},{x:0,y:1},{x:0,y:2},{x:5,y:2},{x:5,y:3},{x:0,y:3},{x:0,y:4},{x:5,y:4},{x:5,y:5},{x:0,y:5},{x:0,y:6},{x:5,y:6}];
        else if(lvl===7) pts=[{x:0,y:0},{x:2,y:0},{x:2,y:2},{x:5,y:2},{x:5,y:4},{x:2,y:4},{x:2,y:6},{x:5,y:6}];
        else if(lvl===8) pts=[{x:0,y:6},{x:5,y:6},{x:5,y:4},{x:1,y:4},{x:1,y:2},{x:5,y:2},{x:5,y:0},{x:0,y:0}];
        else if(lvl===9) pts=[{x:2,y:0},{x:2,y:6},{x:3,y:6},{x:3,y:0}];
        else pts=[{x:0,y:0},{x:5,y:0},{x:5,y:6},{x:0,y:6},{x:0,y:1},{x:4,y:1},{x:4,y:5},{x:1,y:5},{x:1,y:2},{x:3,y:2},{x:3,y:4},{x:2,y:4}];
        return buildPathFromPoints(pts);
    }

    function startGame(mode) {
        document.getElementById('menuMain').classList.add('hidden'); document.getElementById('menuLevel').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        
        gameState = { isActive: true, money: 250 + (player.tech.moneyLv*20), wave: 1, frame: 0, isOver: false, isPaused: false, globalDmgLv: 0, summonLv: 0, bossSpawned: false, mode: mode, speed: 1 };
        enemies = []; towers = []; bullets = []; visuals = []; draggedTower = null; selectedTower = null;
        setSpeed(1);
        
        document.getElementById('maxWaveText').innerText = mode === 'random' ? ' (無盡)' : '/50';
        document.getElementById('pauseBtn').innerText = '⏸️ 暫停'; 
        
        pathCells = (mode === 'random') ? getLevelPath(Math.floor(Math.random()*10)+1) : getLevelPath(mode);
        
        // 啟動 Worker
        gameWorker.postMessage('start');
        updateInfoPanel(); 
    }

    function endGame(isWin) {
        if (gameState.isOver) return; gameState.isOver = true; gameState.isActive = false; 
        gameWorker.postMessage('stop'); // 停止背景執行緒
        
        let title = isWin ? "🎉 防守成功 🎉" : "💀 任務失敗 💀";
        let eExp = gameState.wave * 15 + Math.floor(Math.pow(gameState.wave, 1.2)), eGold = gameState.wave * 10 + Math.floor(Math.pow(gameState.wave, 1.3));
        
        if (isWin && gameState.mode !== 'random' && gameState.mode === player.maxLevel && player.maxLevel < 10) { player.maxLevel++; }

        document.getElementById('resultTitle').innerText = title; document.getElementById('resultTitle').style.color = isWin ? "var(--success)" : "var(--danger)";
        document.getElementById('resWave').innerText = gameState.wave; document.getElementById('resExp').innerText = eExp; document.getElementById('resGold').innerText = eGold;
        
        player.globalGold += eGold; player.exp += eExp;
        while(player.exp >= getMaxExp()) { player.exp -= getMaxExp(); player.level++; }
        saveData(); setTimeout(() => { document.getElementById('resultScreen').classList.remove('hidden'); }, 500);
    }

    function returnToMenu() {
        document.getElementById('resultScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('menuMain').classList.remove('hidden'); updateMenuUI();
    }
    
    loadData();
</script>
