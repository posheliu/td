<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 嚴格鎖定手機視角，禁止任何原生的縮放與滑動 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>英雄元素守塔 - 複雜地圖版</title>
    <style>
        :root {
            --bg-dark: #0f172a; --panel-bg: #1e293b; --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --gold: #fbbf24;
        }
        /* 改用 100% 取代 100vh，徹底解決 Chrome 底部跑版問題 */
        html, body {
            height: 100%; margin: 0; padding: 0; 
            background-color: var(--bg-dark); color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
        }
        
        #app {
            width: 100%; max-width: 500px; height: 100%; margin: 0 auto;
            position: relative; display: flex; flex-direction: column;
        }

        .screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; 
            background-color: var(--bg-dark); z-index: 10;
        }
        .hidden { display: none !important; }
        
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 12px; font-size: 16px;
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.1s; text-align: center;
        }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn:disabled { background-color: #475569; color: #94a3b8; }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }

        /* 首頁樣式 */
        .header-card {
            background: var(--panel-bg); padding: 20px; border-radius: 0 0 15px 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; border-bottom: 2px solid #334155;
        }
        .level-badge { font-size: 24px; font-weight: bold; color: var(--gold); margin-bottom: 5px; }
        .exp-bar-bg { background: #334155; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        .exp-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s; }
        .menu-content { padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; flex-grow: 1; }
        .tech-item {
            background: var(--panel-bg); padding: 15px; border-radius: 10px; display: flex;
            justify-content: space-between; align-items: center; border: 1px solid #334155;
        }
        .tech-info div { font-size: 14px; margin-top: 5px; color: #94a3b8; }

        /* 遊戲內排版 (絕對不會跑版) */
        .game-top-bar {
            flex-shrink: 0; background: var(--panel-bg); display: flex; justify-content: space-between; 
            padding: 10px 15px; font-size: 16px; font-weight: bold; z-index: 5;
        }
        .canvas-container {
            flex-grow: 1; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; background-color: #0b1120;
        }
        canvas {
            max-width: 100%; max-height: 100%; object-fit: contain; cursor: pointer;
        }
        .game-bottom-bar {
            flex-shrink: 0; background: var(--panel-bg); padding: 10px; display: flex; 
            flex-direction: column; gap: 10px; z-index: 5;
        }
        .info-panel {
            background: #0f172a; padding: 10px; border-radius: 8px; font-size: 14px; 
            min-height: 48px; border: 1px solid #334155; box-sizing: border-box;
        }
        .skill-text { color: #38bdf8; font-size: 13px; margin-top: 4px; font-weight: bold; }
        .controls { display: flex; gap: 10px; }
        .controls button { flex: 1; }

        #resultScreen {
            background: rgba(15, 23, 42, 0.95); justify-content: center; align-items: center; 
            z-index: 20; padding: 20px; text-align: center;
        }
        .result-box { background: var(--panel-bg); padding: 30px; border-radius: 15px; width: 100%; }
        .result-box h1 { margin: 0 0 20px 0; }
    </style>
</head>
<body>

<div id="app">
    <!-- 首頁 -->
    <div id="mainMenu" class="screen">
        <div class="header-card">
            <div class="level-badge">指揮官 Lv.<span id="uiLevel">1</span></div>
            <div>全塔基礎素質加成: +<span id="uiLevelBonus">0</span>%</div>
            <div class="exp-bar-bg"><div class="exp-bar-fill" id="uiExpBar"></div></div>
            <div style="font-size:12px; color:#94a3b8">經驗值: <span id="uiExp">0</span> / <span id="uiMaxExp">100</span></div>
            <div style="margin-top:15px; font-size:18px; font-weight:bold; color:var(--gold);">💰 局外金幣: <span id="uiGlobalGold">0</span></div>
        </div>
        <div class="menu-content">
            <button class="btn btn-success" style="padding: 15px; font-size: 18px;" onclick="startGame('level')">🎮 關卡模式 (經典連續彎道)</button>
            <button class="btn btn-success" style="padding: 15px; font-size: 18px;" onclick="startGame('random')">🎲 隨機模式 (高難度迷宮)</button>
            <hr style="border:1px solid #334155; width:100%; margin: 5px 0;">
            <h3 style="margin:0;">🛠️ 科技樹升級</h3>
            <div class="tech-item">
                <div class="tech-info">
                    <strong>⚔️ 傷害強化</strong> (Lv.<span id="techDmgLv">0</span>)<br>
                    <div>基礎攻擊 +<span id="techDmgVal">0</span>%</div>
                </div>
                <button class="btn" id="btnTechDmg" onclick="upgradeTech('dmg')">升級 $<span id="costDmg">50</span></button>
            </div>
            <div class="tech-item">
                <div class="tech-info">
                    <strong>⏱️ 攻速強化</strong> (Lv.<span id="techSpdLv">0</span>)<br>
                    <div>冷卻減少 <span id="techSpdVal">0</span>%</div>
                </div>
                <button class="btn" id="btnTechSpd" onclick="upgradeTech('spd')">升級 $<span id="costSpd">50</span></button>
            </div>
            <div class="tech-item">
                <div class="tech-info">
                    <strong>💰 初始資金</strong> (Lv.<span id="techMoneyLv">0</span>)<br>
                    <div>局內開局 +$<span id="techMoneyVal">0</span></div>
                </div>
                <button class="btn" id="btnTechMoney" onclick="upgradeTech('money')">升級 $<span id="costMoney">100</span></button>
            </div>
        </div>
    </div>

    <!-- 遊戲中畫面 -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-top-bar">
            <div>💰 $<span id="gameMoney" style="color:var(--gold)">0</span></div>
            <div>❤️ <span id="gameLives" style="color:var(--danger)">15</span></div>
            <div>🏢 <span id="gameTowerCount">0</span>/15</div>
            <div style="font-size:12px; color:#94a3b8">波數:<span id="gameWave">1</span></div>
        </div>

        <div class="canvas-container">
            <!-- 解析度放大至 12x17 格 -->
            <canvas id="gameCanvas" width="480" height="680"></canvas>
        </div>

        <div class="game-bottom-bar">
            <div class="info-panel" id="infoPanel">
                <div style="color:#94a3b8; text-align:center; padding-top:4px;">請點擊砲塔查看資訊與技能數值</div>
            </div>
            <div class="controls">
                <button class="btn btn-success" id="summonBtn" onclick="summonTower()">召喚塔 ($30)</button>
                <button class="btn btn-danger" id="upgradeBtn" disabled onclick="upgradeSelected()">強化 ($20)</button>
                <button class="btn" id="sellBtn" disabled onclick="sellSelected()">出售</button>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="resultScreen" class="screen hidden">
        <div class="result-box">
            <h1 id="resultTitle">GAME OVER</h1>
            <p>生存波數： <strong id="resWave">0</strong></p>
            <p style="color:var(--success)">獲得經驗： +<strong id="resExp">0</strong> EXP</p>
            <p style="color:var(--gold)">獲得金幣： +<strong id="resGold">0</strong> 💰</p>
            <br>
            <button class="btn" style="width:100%" onclick="returnToMenu()">返回首頁</button>
        </div>
    </div>
</div>

<script>
    /* 存檔系統 */
    let player = { level: 1, exp: 0, globalGold: 0, tech: { dmgLv: 0, spdLv: 0, moneyLv: 0 }};
    function loadData() { const s = localStorage.getItem('heroTD_v2'); if(s) player = {...player, ...JSON.parse(s)}; updateMenuUI(); }
    function saveData() { localStorage.setItem('heroTD_v2', JSON.stringify(player)); }
    function getMaxExp() { return 100 + (player.level - 1) * 50; }

    function updateMenuUI() {
        document.getElementById('uiLevel').innerText = player.level;
        document.getElementById('uiLevelBonus').innerText = (player.level - 1) * 2;
        document.getElementById('uiExp').innerText = player.exp;
        document.getElementById('uiMaxExp').innerText = getMaxExp();
        document.getElementById('uiExpBar').style.width = Math.min(100, (player.exp / getMaxExp()) * 100) + '%';
        document.getElementById('uiGlobalGold').innerText = player.globalGold;

        const cDmg = 50 + player.tech.dmgLv * 30, cSpd = 50 + player.tech.spdLv * 40, cMon = 100 + player.tech.moneyLv * 50;
        document.getElementById('techDmgLv').innerText = player.tech.dmgLv; document.getElementById('techDmgVal').innerText = player.tech.dmgLv * 5;
        document.getElementById('costDmg').innerText = cDmg; document.getElementById('btnTechDmg').disabled = player.globalGold < cDmg;

        document.getElementById('techSpdLv').innerText = player.tech.spdLv; document.getElementById('techSpdVal').innerText = player.tech.spdLv * 3;
        document.getElementById('costSpd').innerText = cSpd; document.getElementById('btnTechSpd').disabled = player.globalGold < cSpd || player.tech.spdLv >= 10;

        document.getElementById('techMoneyLv').innerText = player.tech.moneyLv; document.getElementById('techMoneyVal').innerText = player.tech.moneyLv * 20;
        document.getElementById('costMoney').innerText = cMon; document.getElementById('btnTechMoney').disabled = player.globalGold < cMon;
    }

    function upgradeTech(type) {
        let c = 0;
        if (type==='dmg') { c = 50+player.tech.dmgLv*30; if(player.globalGold>=c){ player.globalGold-=c; player.tech.dmgLv++; } }
        else if (type==='spd') { c = 50+player.tech.spdLv*40; if(player.globalGold>=c && player.tech.spdLv<10){ player.globalGold-=c; player.tech.spdLv++; } }
        else if (type==='money') { c = 100+player.tech.moneyLv*50; if(player.globalGold>=c){ player.globalGold-=c; player.tech.moneyLv++; } }
        saveData(); updateMenuUI();
    }

    /* 遊戲引擎 */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // 全新大型地圖參數 (480x680 -> 12欄 x 17列)
    const GAME_W = 480, GAME_H = 680, TILE = 40, COLS = 12, ROWS = 17;
    const MAX_TOWERS = 15;

    let gameState = { money: 0, lives: 15, wave: 1, frame: 0, isOver: false, loopId: null };
    let pathCells = [], enemies = [], towers = [], bullets = [], visuals = [];
    let draggedTower = null, selectedTower = null;
    let dragStartX = 0, dragStartY = 0, mouseX = 0, mouseY = 0;

    const ELEMENTS = {
        'FIRE':  { color: '#ef4444', name: '火', dmg: 35, cd: 45, range: 110 },
        'WATER': { color: '#3b82f6', name: '水', dmg: 20, cd: 30, range: 100 },
        'WIND':  { color: '#22c55e', name: '風', dmg: 15, cd: 25, range: 130 },
        'ELEC':  { color: '#eab308', name: '電', dmg: 55, cd: 55, range: 100 },
        'ICE':   { color: '#06b6d4', name: '冰', dmg: 25, cd: 40, range: 90 }
    };
    const E_KEYS = Object.keys(ELEMENTS);

    // 複雜路線產生器 (根據轉折點自動鋪路)
    function buildPath(points) {
        let p = [];
        for(let i=0; i<points.length-1; i++) {
            let p1 = points[i], p2 = points[i+1];
            let dx = Math.sign(p2.x - p1.x), dy = Math.sign(p2.y - p1.y);
            let cx = p1.x, cy = p1.y;
            while(cx !== p2.x || cy !== p2.y) {
                p.push({x: cx, y: cy});
                cx += dx; cy += dy;
            }
        }
        p.push(points[points.length-1]);
        return p;
    }

    class Enemy {
        constructor(wave) {
            this.pathIndex = 0;
            this.x = pathCells[0].x * TILE + TILE/2; this.y = pathCells[0].y * TILE + TILE/2;
            this.maxHp = 60 + wave * 35 + Math.pow(wave, 1.6) * 5; this.hp = this.maxHp;
            this.baseSpeed = 1.0 + (wave * 0.02); // 速度成長調慢，配合長地圖
            this.radius = 12; this.reward = 5 + Math.floor(wave / 5);
            this.slowTimer = 0; this.slowRatio = 1;
        }
        update() {
            let tg = pathCells[this.pathIndex + 1];
            if (!tg) { gameState.lives--; updateGameUI(); return false; }
            let spd = this.slowTimer > 0 ? this.baseSpeed * this.slowRatio : this.baseSpeed;
            if(this.slowTimer > 0) this.slowTimer--;

            let tx = tg.x * TILE + TILE/2, ty = tg.y * TILE + TILE/2;
            let dx = tx - this.x, dy = ty - this.y;
            let dist = Math.hypot(dx, dy);

            if (dist < spd) { this.x = tx; this.y = ty; this.pathIndex++; } 
            else { this.x += (dx/dist)*spd; this.y += (dy/dist)*spd; }
            return this.hp > 0;
        }
        draw() {
            ctx.fillStyle = this.slowTimer > 0 ? '#7dd3fc' : '#a855f7';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
            if(this.slowTimer > 0) { ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2; ctx.stroke(); }
            ctx.fillStyle = '#1e293b'; ctx.fillRect(this.x-15, this.y-18, 30, 4);
            ctx.fillStyle = '#22c55e'; ctx.fillRect(this.x-15, this.y-18, 30*(this.hp/this.maxHp), 4);
        }
    }

    class Tower {
        constructor(gx, gy, isBench) {
            this.gridX = gx; this.gridY = gy; this.isBench = isBench;
            this.star = 1; this.upgradeLv = 0; this.timer = 0; this.fireBuff = 1; 
            let k = E_KEYS[Math.floor(Math.random() * E_KEYS.length)];
            this.type = k; this.baseStats = ELEMENTS[k];
            this.updatePosition();
        }
        updatePosition() { this.x = this.gridX * TILE + TILE/2; this.y = this.gridY * TILE + TILE/2; }
        getDamage() {
            let lvM = 1 + ((player.level - 1) * 0.02), tcM = 1 + (player.tech.dmgLv * 0.05);
            return this.baseStats.dmg * lvM * tcM * Math.pow(1.8, this.star - 1) * (1 + this.upgradeLv * 0.5) * this.fireBuff;
        }
        getCooldown() { return Math.max(10, (this.baseStats.cd - this.star * 2) * (1 - player.tech.spdLv * 0.03)); }
        update() {
            if (this.isBench || this === draggedTower) return;
            if (this.timer > 0) this.timer--;
            if (this.timer <= 0) {
                let tgts = enemies.filter(e => Math.hypot(e.x - this.x, e.y - this.y) <= this.baseStats.range);
                if (tgts.length > 0) {
                    let shots = (this.type === 'WIND') ? 1 + this.star : 1;
                    for (let i = 0; i < Math.min(tgts.length, shots); i++) {
                        bullets.push(new Bullet(this.x, this.y, tgts[i], this.getDamage(), this.type, this.star));
                    }
                    this.timer = this.getCooldown();
                }
            }
        }
        draw(dx = this.x, dy = this.y) {
            ctx.fillStyle = this.isBench ? '#334155' : '#1e293b';
            ctx.fillRect(dx-18, dy-18, 36, 36);
            if (this === selectedTower && !draggedTower) { ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2; ctx.strokeRect(dx-20, dy-20, 40, 40); }
            if (this.fireBuff > 1 && !this.isBench) { ctx.beginPath(); ctx.arc(dx, dy, 18, 0, Math.PI*2); ctx.fillStyle='rgba(239, 68, 68, 0.3)'; ctx.fill(); }
            
            ctx.fillStyle = this.baseStats.color; ctx.beginPath(); ctx.arc(dx, dy, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'white'; ctx.font = '11px sans-serif'; ctx.textAlign='left'; ctx.fillText('★'+this.star, dx-18, dy-8);
            if (this.upgradeLv>0) { ctx.fillStyle='#fbbf24'; ctx.fillText('+'+this.upgradeLv, dx+4, dy-8); }
            ctx.fillStyle = 'white'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(this.baseStats.name, dx, dy+4);
        }
    }

    class Bullet {
        constructor(x, y, tg, dmg, t, s) {
            this.x=x; this.y=y; this.target=tg; this.damage=dmg; this.type=t; this.star=s;
            this.color = ELEMENTS[t].color; this.speed = 12;
        }
        update() {
            if(this.target.hp <= 0) return false;
            let dx = this.target.x-this.x, dy = this.target.y-this.y, dist = Math.hypot(dx, dy);
            if(dist < this.speed + this.target.radius) {
                if(this.type === 'ICE') {
                    this.target.hp -= this.damage; this.target.slowTimer = 45 + this.star * 15; 
                    this.target.slowRatio = Math.max(0.15, 0.6 - (this.star * 0.1));
                } else if(this.type === 'WATER') {
                    this.target.hp -= this.damage; let r = 40 + this.star*10, sd = this.damage*(0.4+this.star*0.1);
                    visuals.push({ t:'splash', x:this.target.x, y:this.target.y, r:0, maxR:r, life:15 });
                    enemies.forEach(e => { if(e!==this.target && Math.hypot(e.x-this.target.x, e.y-this.target.y)<r) e.hp -= sd; });
                } else if(this.type === 'ELEC') {
                    this.target.hp -= this.damage; let ch = enemies.filter(e => e!==this.target && Math.hypot(e.x-this.target.x, e.y-this.target.y)<100);
                    for(let i=0; i<Math.min(ch.length, 1+this.star); i++) {
                        ch[i].hp -= this.damage*0.8; visuals.push({ t:'bolt', x1:this.target.x, y1:this.target.y, x2:ch[i].x, y2:ch[i].y, life:10 });
                    }
                } else { this.target.hp -= this.damage; }
                if(this.target.hp <= 0) { gameState.money += this.target.reward; updateGameUI(); }
                return false;
            }
            this.x += (dx/dist)*this.speed; this.y += (dy/dist)*this.speed; return true;
        }
        draw() { ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill(); }
    }

    function updateAuras() {
        towers.forEach(t => t.fireBuff = 1);
        towers.forEach(t => {
            if (t.type === 'FIRE' && !t.isBench) {
                let buff = 1.3 + (t.star * 0.2);
                towers.forEach(o => {
                    if (o!==t && !o.isBench && Math.hypot(o.x-t.x, o.y-t.y) <= t.baseStats.range) o.fireBuff = Math.max(o.fireBuff, buff);
                });
            }
        });
    }

    function updateGameUI() {
        document.getElementById('gameMoney').innerText = gameState.money;
        document.getElementById('gameLives').innerText = gameState.lives;
        document.getElementById('gameTowerCount').innerText = towers.filter(t => !t.isBench).length;
        document.getElementById('gameWave').innerText = gameState.wave;

        const info = document.getElementById('infoPanel'), up = document.getElementById('upgradeBtn'), sel = document.getElementById('sellBtn');
        if (selectedTower) {
            let t = selectedTower, d = Math.floor(t.getDamage()), sP = 15*Math.pow(2, t.star-1) + t.upgradeLv*10;
            let desc = "";
            if(t.type==='FIRE') desc=`光環增傷 +${Math.round((1.3+t.star*0.2-1)*100)}%`;
            if(t.type==='WATER') desc=`水花半徑 ${40+t.star*10} | 擴散 ${Math.round((0.4+t.star*0.1)*100)}%`;
            if(t.type==='WIND') desc=`多重鎖定: 同時攻擊 ${1+t.star} 個目標`;
            if(t.type==='ELEC') desc=`連鎖閃電: 彈跳 ${1+t.star} 個目標`;
            if(t.type==='ICE') desc=`極寒冰凍: 減速至 ${Math.round((Math.max(0.15, 0.6-t.star*0.1))*100)}%`;

            info.innerHTML = `<div style="display:flex; justify-content:space-between; color:${t.baseStats.color}; font-weight:bold;">
                <span>${t.baseStats.name}塔 ★${t.star} (+${t.upgradeLv})</span><span>攻擊: ${d} | 範圍: ${t.baseStats.range}</span></div>
                <div class="skill-text">✨ 技能：${desc}</div>`;
            up.disabled = gameState.money < 20; sel.disabled = false; sel.innerText = `出售 ($${sP})`;
        } else {
            info.innerHTML = `<div style="color:#94a3b8; text-align:center; padding-top:4px;">請點擊砲塔查看資訊與技能數值</div>`;
            up.disabled = true; sel.disabled = true; sel.innerText = `出售`;
        }
        if (gameState.lives <= 0 && !gameState.isOver) endGame();
    }

    /* 滑鼠與觸控安全防呆系統 (解決 LINE Browser 崩潰問題) */
    function getEventCoords(e) {
        let rect = canvas.getBoundingClientRect();
        let cx = e.clientX, cy = e.clientY;
        // 嚴格解析觸控陣列
        if (e.changedTouches && e.changedTouches.length > 0) {
            cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
        } else if (e.touches && e.touches.length > 0) {
            cx = e.touches[0].clientX; cy = e.touches[0].clientY;
        }
        return { x: (cx - rect.left) * (GAME_W / rect.width), y: (cy - rect.top) * (GAME_H / rect.height) };
    }

    function handleStart(e) {
        try {
            if(gameState.isOver) return;
            let pos = getEventCoords(e);
            let gx = Math.floor(pos.x / TILE), gy = Math.floor(pos.y / TILE);
            let t = towers.find(t => t.gridX === gx && t.gridY === gy);
            if(t) { draggedTower = t; dragStartX = gx; dragStartY = gy; } else { selectedTower = null; updateGameUI(); }
        } catch(err) { console.error(err); }
    }

    function handleMove(e) {
        try { if(draggedTower) { let pos = getEventCoords(e); mouseX = pos.x; mouseY = pos.y; } } catch(err){}
    }

    function handleEnd(e) {
        try {
            if(!draggedTower) return;
            let pos = getEventCoords(e);
            let dropX = Math.floor(pos.x / TILE), dropY = Math.floor(pos.y / TILE);
            
            // 座標超出畫布的防呆
            if(isNaN(dropX) || isNaN(dropY)) { draggedTower.updatePosition(); draggedTower = null; updateGameUI(); return; }

            let isClick = (dropX === dragStartX && dropY === dragStartY);
            let inBoard = dropY >= 0 && dropY <= 12; // 0~12是戰鬥區
            let inBench = dropY >= 14 && dropY <= 15; // 14~15是備戰區
            let targetT = towers.find(t => t.gridX === dropX && t.gridY === dropY && t !== draggedTower);
            let onPath = pathCells.some(c => c.x === dropX && c.y === dropY);

            if(isClick) { selectedTower = draggedTower; } 
            else {
                if(targetT) {
                    if(targetT.star === draggedTower.star) {
                        targetT.star++; targetT.upgradeLv = Math.floor((targetT.upgradeLv+draggedTower.upgradeLv)/2);
                        towers = towers.filter(t => t !== draggedTower);
                        if(selectedTower === draggedTower) selectedTower = targetT;
                    } else {
                        let tx = targetT.gridX, ty = targetT.gridY, tb = targetT.isBench;
                        targetT.gridX = draggedTower.gridX; targetT.gridY = draggedTower.gridY; targetT.isBench = draggedTower.isBench;
                        draggedTower.gridX = tx; draggedTower.gridY = ty; draggedTower.isBench = tb;
                        targetT.updatePosition(); draggedTower.updatePosition(); selectedTower = draggedTower;
                    }
                } else if(inBoard && !onPath) {
                    if(draggedTower.isBench && towers.filter(t=>!t.isBench).length >= MAX_TOWERS) draggedTower.updatePosition();
                    else { draggedTower.gridX = dropX; draggedTower.gridY = dropY; draggedTower.isBench = false; draggedTower.updatePosition(); selectedTower = draggedTower; }
                } else if(inBench) {
                    draggedTower.gridX = dropX; draggedTower.gridY = dropY; draggedTower.isBench = true; draggedTower.updatePosition(); selectedTower = draggedTower;
                } else { draggedTower.updatePosition(); }
            }
        } catch(err) { console.error(err); if(draggedTower) draggedTower.updatePosition(); }
        finally { draggedTower = null; updateAuras(); updateGameUI(); }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleStart(e); }, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); handleMove(e); }, {passive:false});
    canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); handleEnd(e); }, {passive:false});

    function summonTower() {
        if(gameState.money >= 30) {
            let empty = null;
            // 備戰區置中 10 格 (x:1~10)
            for(let y=14; y<=15; y++){ for(let x=1; x<=10; x++){ if(!towers.find(t=>t.gridX===x && t.gridY===y)) { empty={x,y}; break; } } if(empty) break; }
            if(empty) { gameState.money-=30; towers.push(new Tower(empty.x, empty.y, true)); updateGameUI(); } 
            else alert("備戰區已滿！");
        }
    }
    function upgradeSelected() { if(selectedTower && gameState.money>=20){ gameState.money-=20; selectedTower.upgradeLv++; updateGameUI(); } }
    function sellSelected() {
        if(selectedTower){ gameState.money += 15*Math.pow(2, selectedTower.star-1)+selectedTower.upgradeLv*10; towers = towers.filter(t=>t!==selectedTower); selectedTower=null; updateAuras(); updateGameUI(); }
    }

    function drawGrid() {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, GAME_W, GAME_H);
        
        // 戰鬥區網格暗線
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
        for(let i=0; i<GAME_W; i+=TILE) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 13*TILE); ctx.stroke(); }
        for(let j=0; j<=13*TILE; j+=TILE) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(GAME_W, j); ctx.stroke(); }

        // 怪獸路線
        ctx.fillStyle = '#334155'; for(let c of pathCells) ctx.fillRect(c.x*TILE, c.y*TILE, TILE, TILE);
        
        // 分界線 Y=13
        ctx.fillStyle = '#0b1120'; ctx.fillRect(0, 13*TILE, GAME_W, TILE);
        ctx.fillStyle = '#94a3b8'; ctx.font = '15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText("⬇️ 備戰區 (拖曳合成同星級) ⬇️", GAME_W/2, 13*TILE + TILE/2);
        
        // 備戰區外框
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
        for(let y=14; y<=15; y++) { for(let x=1; x<=10; x++) ctx.strokeRect(x*TILE, y*TILE, TILE, TILE); }
    }

    function loop() {
        if(gameState.isOver) return;
        ctx.clearRect(0, 0, GAME_W, GAME_H); drawGrid(); updateAuras();
        gameState.frame++;
        
        if (gameState.frame % 600 === 0) { gameState.wave++; updateGameUI(); }
        let spInt = Math.max(30, 150 - gameState.wave * 5); // 生成間隔拉長適應大圖
        if (gameState.frame % spInt === 0) enemies.push(new Enemy(gameState.wave));
        
        enemies = enemies.filter(e => { let a = e.update(); if(a) e.draw(); return a && e.hp>0; });

        if (selectedTower && !draggedTower) {
            ctx.beginPath(); ctx.arc(selectedTower.x, selectedTower.y, selectedTower.baseStats.range, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.stroke();
        }

        towers.forEach(t => { if(t !== draggedTower) { t.update(); t.draw(); } });
        bullets = bullets.filter(b => { let a = b.update(); if(a) b.draw(); return a; });

        visuals = visuals.filter(v => {
            if(v.t === 'splash') { v.r += (v.maxR-v.r)*0.3; ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, Math.PI*2); ctx.fillStyle=`rgba(59,130,246,${v.life/15*0.5})`; ctx.fill(); }
            else if(v.t === 'bolt') { ctx.beginPath(); ctx.moveTo(v.x1, v.y1); ctx.lineTo(v.x2, v.y2); ctx.strokeStyle=`rgba(234,179,8,${v.life/10})`; ctx.lineWidth=3; ctx.stroke(); }
            v.life--; return v.life>0;
        });

        if (draggedTower) {
            if (mouseY < 13*TILE) { 
                ctx.beginPath(); ctx.arc(mouseX, mouseY, draggedTower.baseStats.range, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke();
            }
            draggedTower.draw(mouseX, mouseY);
        }
        gameState.loopId = requestAnimationFrame(loop);
    }

    function startGame(mode) {
        document.getElementById('mainMenu').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden');
        gameState = { money: 250 + (player.tech.moneyLv*20), lives: 15, wave: 1, frame: 0, isOver: false, loopId: null };
        enemies = []; towers = []; bullets = []; visuals = []; draggedTower = null; selectedTower = null;

        // 地圖庫 (座標陣列)
        const MAP_CLASSIC = [{x:0,y:1},{x:10,y:1},{x:10,y:4},{x:1,y:4},{x:1,y:7},{x:10,y:7},{x:10,y:10},{x:1,y:10},{x:1,y:12},{x:11,y:12}];
        const MAP_R1 = [{x:0,y:0},{x:11,y:0},{x:11,y:11},{x:1,y:11},{x:1,y:3},{x:9,y:3},{x:9,y:9},{x:3,y:9},{x:3,y:5},{x:7,y:5},{x:7,y:7},{x:5,y:7}]; // 螺旋
        const MAP_R2 = [{x:1,y:0},{x:1,y:10},{x:4,y:10},{x:4,y:2},{x:7,y:2},{x:7,y:12},{x:10,y:12},{x:10,y:6},{x:11,y:6}]; // 垂直閃電
        const MAP_R3 = [{x:0,y:12},{x:2,y:12},{x:2,y:9},{x:5,y:9},{x:5,y:6},{x:8,y:6},{x:8,y:3},{x:11,y:3},{x:11,y:0}]; // 階梯

        if (mode === 'level') pathCells = buildPath(MAP_CLASSIC);
        else {
            let pools = [MAP_R1, MAP_R2, MAP_R3];
            pathCells = buildPath(pools[Math.floor(Math.random() * pools.length)]);
        }
        updateGameUI(); gameState.loopId = requestAnimationFrame(loop);
    }

    function endGame() {
        gameState.isOver = true; cancelAnimationFrame(gameState.loopId);
        let eExp = gameState.wave * 15 + Math.floor(Math.pow(gameState.wave, 1.2)), eGold = gameState.wave * 10 + Math.floor(Math.pow(gameState.wave, 1.3));
        document.getElementById('resWave').innerText = gameState.wave; document.getElementById('resExp').innerText = eExp; document.getElementById('resGold').innerText = eGold;
        player.globalGold += eGold; player.exp += eExp;
        while(player.exp >= getMaxExp()) { player.exp -= getMaxExp(); player.level++; }
        saveData(); setTimeout(() => { document.getElementById('resultScreen').classList.remove('hidden'); }, 500);
    }

    function returnToMenu() {
        document.getElementById('resultScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('mainMenu').classList.remove('hidden'); updateMenuUI();
    }
    loadData();
</script>
</body>
